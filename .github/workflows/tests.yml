name: tests
on: [push, pull_request]
jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # No Whisper model and no Claude: the brain is a fake client and the transcriber a stub.
      # ffmpeg is real, so tests/test_render_ffmpeg.py renders and measures one actual file.
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install pytest numpy Pillow
      - run: pytest -q
